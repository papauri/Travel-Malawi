<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1c1917" />
    <title>Travel Malawi</title>
    <meta name="description" content="A direct booking platform connecting travelers with independent lodges, B&Bs, cottages, guest houses, and safari camps across Malawi." />
    <meta property="og:title" content="Travel Malawi" />
    <meta property="og:description" content="A direct booking platform connecting travelers with independent lodges, B&Bs, cottages, guest houses, and safari camps across Malawi." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/hotels/kaya_main.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Travel Malawi" />
    <meta name="twitter:description" content="A direct booking platform connecting travelers with independent lodges, B&Bs, cottages, guest houses, and safari camps across Malawi." />
    <meta name="twitter:image" content="/hotels/kaya_main.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <style>
        .pwa-preloader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #1c1917;
          color: #fafaf9;
          font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
          z-index: 99999;
          padding: 24px;
          text-align: center;
        }
        .pwa-preloader-emblem {
          position: relative;
          width: 56px;
          height: 56px;
          margin-bottom: 24px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .pwa-preloader-glow {
          position: absolute;
          inset: -6px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(217, 119, 6, 0.25) 0%, rgba(28, 25, 23, 0) 70%);
          animation: pwa-pulse 2s ease-in-out infinite;
        }
        .pwa-preloader-ring {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 2px solid #292524;
          border-top-color: #f59e0b;
          border-right-color: rgba(245, 158, 11, 0.4);
          animation: pwa-spin 1.2s linear infinite;
        }
        .pwa-preloader-dot {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background-color: #f59e0b;
          box-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
        }
        .pwa-preloader-title {
          font-family: 'Playfair Display', Georgia, serif;
          font-size: 24px;
          font-weight: 700;
          letter-spacing: -0.02em;
          color: #ffffff;
          margin: 0 0 6px 0;
        }
        .pwa-preloader-sub {
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: #a8a29e;
          margin: 0 0 28px 0;
        }
        .pwa-preloader-bar-wrap {
          width: 160px;
          height: 2px;
          background-color: #292524;
          border-radius: 9999px;
          overflow: hidden;
          position: relative;
        }
        .pwa-preloader-bar {
          position: absolute;
          top: 0;
          left: 0;
          height: 100%;
          width: 50%;
          background: linear-gradient(90deg, #d97706, #f59e0b, #fbbf24);
          border-radius: 9999px;
          animation: pwa-indeterminate 1.4s ease-in-out infinite;
        }
        .pwa-preloader-welcome {
          margin-top: 20px;
          font-size: 11px;
          color: #78716c;
          font-weight: 500;
          letter-spacing: 0.05em;
        }
        @keyframes pwa-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes pwa-pulse {
          0%, 100% { opacity: 0.5; transform: scale(0.95); }
          50% { opacity: 1; transform: scale(1.08); }
        }
        @keyframes pwa-indeterminate {
          0% { left: -50%; width: 40%; }
          50% { left: 25%; width: 60%; }
          100% { left: 100%; width: 40%; }
        }
      </style>
      <div class="pwa-preloader">
        <div class="pwa-preloader-emblem">
          <div class="pwa-preloader-glow"></div>
          <div class="pwa-preloader-ring"></div>
          <div class="pwa-preloader-dot"></div>
        </div>
        <h1 class="pwa-preloader-title">Travel Malawi</h1>
        <p class="pwa-preloader-sub">The Warm Heart of Africa</p>
        <div class="pwa-preloader-bar-wrap">
          <div class="pwa-preloader-bar"></div>
        </div>
        <p class="pwa-preloader-welcome">Takulandirani</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
