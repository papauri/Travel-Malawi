            "target": {

              "urlTemplate": "https://ulendomalawi.com/?search={search_term_string}"

            "query-input": "required name=search_term_string"

        {
          "@type": "Organization",
          "@id": "https://ulendomalawi.com/#organization",
          "name": "Travel Malawi",
          "alternateName": ["Ulendo Malawi", "Travel Malawi Directory"],
          "url": "https://ulendomalawi.com/",
          "logo": "https://ulendomalawi.com/favicon-32.png",
          "image": "https://ulendomalawi.com/icons/icon-512.png",

    <link rel="preconnect" href="https://fonts.googleapis.com">

  </head>
  <body>
    <div id="root">
      <!-- Splash until the app mounts: the app's own background, the wordmark and
           a hairline route (same motif as src/components/Loading.tsx). It fades in
           after a beat, so a fast load shows only the plain background. -->
      <style>
        .tm-splash {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #fafafa;
          z-index: 99999;
        }
        .tm-splash-inner {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
          animation: tm-splash-in 0.4s ease 0.25s both;
        }
        .tm-splash-mark {
          margin: 0;
          font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
          font-size: 26px;
          font-weight: 600;
          letter-spacing: -0.01em;
          color: #1c1917;
        }
        .tm-splash-route {
          position: relative;
          width: 120px;
          height: 1px;
          background: #e7e5e4;
          overflow: hidden;
        }
        .tm-splash-route::after {
          content: '';
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          width: 32px;
          background: #1c1917;
          animation: tm-splash-travel 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
        @keyframes tm-splash-in {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        @keyframes tm-splash-travel {
          from { transform: translateX(-32px); }
          to { transform: translateX(120px); }
        }
        @media (prefers-reduced-motion: reduce) {
          .tm-splash-route::after { animation: none; width: 100%; opacity: 0.3; }
        }
      </style>
      <div class="tm-splash" role="status" aria-label="Loading Travel Malawi">
        <div class="tm-splash-inner">
          <p class="tm-splash-mark">Travel Malawi</p>
          <div class="tm-splash-route"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
