<!-- Public copy of clean concept survey -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Malawi — Pre-Launch Partner Survey</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f5f5f4; color: #1c1917; margin: 0; padding: 24px; line-height: 1.6; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; border: 1px solid #e7e5e4; border-radius: 16px; padding: 36px; }
    .toolbar { display: flex; justify-content: space-between; border-bottom: 1px solid #e7e5e4; padding-bottom: 16px; margin-bottom: 24px; }
    .btn { background: #1c1917; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .input { width: 100%; padding: 8px 12px; border: 1px solid #e7e5e4; border-radius: 6px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="toolbar">
      <div style="font-weight: 700;">TRAVEL MALAWI &bull; PARTNER SURVEY</div>
      <button class="btn" onclick="window.print()">Print / Save PDF</button>
    </div>
    <h1 style="font-family: 'Playfair Display', serif; font-size: 26px;">Pre-Launch Partner Survey: Direct Bookings &amp; Local Payments</h1>
    <p style="color: #57534e; font-size: 13px;">Collecting feedback from lodge managers and cottage owners across Malawi.</p>
    <div style="margin-top: 24px;">
      <label style="font-size: 12px; font-weight: 600;">Lodge / Cottage Name</label>
      <input type="text" id="propName" class="input" placeholder="e.g. Cape Maclear Sunset Lodge">
      <label style="font-size: 12px; font-weight: 600;">WhatsApp Number</label>
      <input type="text" id="phone" class="input" placeholder="+265 999 00 00 00">
      <button class="btn" style="background: #059669; width: 100%; padding: 12px;" onclick="alert('Thank you! Responses submitted.');">Submit Response</button>
    </div>
  </div>
</body>
</html>
